<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>ToDo Stock</h2>
            <span>Panel vendedor</span>
            <br>
            <div>
                <span class="sidebar-nav-name" style="cursor: pointer;" (click)="abrirPerfil()" title="Ver y editar mi perfil">
                    <i class="bi bi-person-circle me-1"></i> {{ nombreUsuario }}
                </span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a routerLink="catalogo" routerLinkActive="active">Catalogo</a>
            @if( estaLogeado ) {
            <a routerLink="movimientos" routerLinkActive="active">Movimientos</a>
            }
        </nav>
        <div class="sidebar-footer d-flex flex-column gap-2">
            <a href="javascript:void(0)" (click)="abrirPerfil()"><i class="bi bi-person-gear me-1"></i> Mi Perfil</a>
            <a href="javascript:void(0)" (click)="abrirContacto()"><i class="bi bi-headset me-1"></i> Contacto y Soporte</a>
            <a routerLink="/home"><i class="bi bi-arrow-left me-1"></i> Volver al inicio</a>
        </div>
    </aside>

    <main class="dashboard-content">
        <router-outlet></router-outlet>
    </main>

    <!-- Modales Globales de Perfil y Contacto para Vendedor -->
    <app-modal-perfil [mostrar]="mostrarModalPerfil" (cerrar)="cerrarPerfil()"></app-modal-perfil>
    <app-modal-contacto [mostrar]="mostrarModalContacto" (cerrar)="cerrarContacto()"></app-modal-contacto>

</div>
