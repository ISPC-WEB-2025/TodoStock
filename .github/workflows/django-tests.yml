name: Backend Tests (Django)

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: Ejecutar Tests
    runs-on: ubuntu-latest

    # Levantamos una base de datos MySQL temporal solo para los tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todostock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend/requirements.txt

    - name: Correr tests de Django
      env:
        SECRET_KEY: clave-secreta-solo-para-testing
        DEBUG: True
        DB_NAME: todostock
        DB_USER: root
        DB_PASSWORD: root
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
      run: |
        cd Backend
        python manage.py test

